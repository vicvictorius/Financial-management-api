services:
  api:
    build: .
    container_name: financial_api

    ports:
      - "8000:8000"

    env_file:
      - ${ENV_FILE:-.env}

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: financial_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_db


    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: