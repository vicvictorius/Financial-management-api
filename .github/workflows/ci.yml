name: CI

on:
  push:
    branches:
      - main
      - feature/ci-cd
      - feature/deploy
      - feature/observability

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.7

      - name: Run Ruff
        run: ruff check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          cat > .env.test << 'EOF'
          DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/financial_db
          TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/financial_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=financial_db
          SECRET_KEY=test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      - name: Build Docker image
        run: ENV_FILE=.env.test docker compose build

      - name: Run Unit Tests
        run: ENV_FILE=.env.test docker compose run --rm api pytest -v

      - name: Cleanup
        if: always()
        run: ENV_FILE=.env.test docker compose down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test environment
        run: |
          cat > .env.test << 'EOF'
          DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/financial_db
          TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/financial_db
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=financial_db
          SECRET_KEY=test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF

      - name: Build Docker image
        run: ENV_FILE=.env.test docker compose build

      - name: Run Integration Tests
        run: ENV_FILE=.env.test docker compose run --rm api pytest tests/integration -v

      - name: Cleanup
        if: always()
        run: ENV_FILE=.env.test docker compose down -v

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install security tools
        run: python -m pip install pip-audit bandit

      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Run Bandit
        run: bandit -r app -ll

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t financial-management-api:${{ github.sha }} .

  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/deploy'

    steps:
      - name: Trigger Render Deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
