name: CI

on:
  push:
    branches:
      - main
      - feature/ci-cd
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: ENV_FILE=.env.test docker compose build

      - name: Run Ruff
        run: ENV_FILE=.env.test docker compose run --rm api ruff check .

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: ENV_FILE=.env.test docker compose build

      - name: Run Unit Tests
        run: ENV_FILE=.env.test docker compose run --rm api pytest -v

      - name: Cleanup
        if: always()
        run: ENV_FILE=.env.test docker compose down -v